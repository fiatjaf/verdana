name: android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # same x/mobile as backend/go.mod, gomobile must match the runtime
  XMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  # gomobile bind needs the ndk to cross-compile the cgo parts
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          # the default list has "tools", which sdkmanager no longer knows;
          # the step below installs what the build needs
          packages: ""

      - name: install sdk packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          yes | sdkmanager --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION
          go install golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: bind backend to aar
        working-directory: backend
        run: |
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/backend.aar ./mobile

      # the apk picks backend.aar up from app/libs
      - name: assemble
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: verdana-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
