name: android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # same x/mobile as backend/go.mod, gomobile must match the runtime
  XMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  # gomobile bind needs the ndk to cross-compile the cgo parts
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    name: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # tags are needed so gradle can derive the version from git describe
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          # the default list has "tools", which sdkmanager no longer knows;
          # the step below installs what the build needs
          packages: ""

      - name: install sdk packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          yes | sdkmanager --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION
          go install golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: bind backend to aar
        working-directory: backend
        run: |
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/backend.aar ./mobile

      # the apk picks backend.aar up from app/libs
      - name: assemble
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: verdana-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/verdana-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: publish release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
