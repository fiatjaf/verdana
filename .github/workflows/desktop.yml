name: desktop

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: test backend
        working-directory: backend
        run: go test ./...

      # embed_prod.go embeds both shells, so they have to exist before the
      # desktop package can even be compiled on a fresh checkout
      - name: build shells
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: |
          go build -o child/child ./child
          go build -o wasmchild/wasmchild ./wasmchild

      - name: test desktop
        working-directory: desktop
        run: go test ./...

  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux-amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            id: linux-arm64
            arch: arm64
          - os: windows-2022
            id: windows-amd64
          - os: macos-15-intel
            id: darwin-amd64
          - os: macos-15
            id: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      # gio (wayland/x11 + egl) and go-webview (gtk3 + webkit2gtk 4.1) are cgo
      - name: linux deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - name: windows deps
        if: runner.os == 'Windows'
        run: |
          choco install --yes --no-progress mingw
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
          echo "CC=gcc" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: download modules
        working-directory: .
        run: |
          cd backend && go mod download
          cd ../desktop && go mod download

      # the shells (the webview host and the wasm canvas host) are embedded
      # into the main binary by embed_prod.go, so they have to be built for
      # the same target first
      - name: build shells
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: |
          go build -o child/child ./child
          go build -o wasmchild/wasmchild ./wasmchild

      # a windows .exe with no icon of its own shows the generic exe picture in
      # Explorer, the taskbar and the Start Menu. desktop/icon.rc names the file
      # and windres (from the mingw install above) compiles it into an object
      # the go linker puts in the binary. generated here rather than committed,
      # because it is a build product that has to match the committed icon.
      - name: embed the icon in the exe
        if: runner.os == 'Windows'
        shell: bash
        working-directory: desktop
        run: |
          w=$(command -v windres || command -v x86_64-w64-mingw32-windres || command -v i686-w64-mingw32-windres)
          if [ -z "$w" ]; then
            echo "no windres on PATH: the exe would ship without an icon" >&2
            exit 1
          fi
          echo "using $w"
          "$w" --target=pe-x86-64 -i icon.rc -o rsrc.syso

      - name: build verdana
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go build -o verdana -ldflags "-s -w" .

      # everything that gets released goes in release/: the bare binary stays in
      # dist/, where nfpm picks it up, so the release never carries several
      # files all called "verdana" from different platforms
      - name: package
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p dist release
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv verdana dist/verdana.exe
            7z a "release/verdana-${{ matrix.id }}.zip" ./dist/verdana.exe
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # the binary, its menu entry and icon, and install.sh to put them
            # in place (~/.local, or /usr/local as root)
            mv verdana dist/verdana
            pkg="dist/verdana-${{ matrix.id }}"
            mkdir -p "$pkg"
            cp dist/verdana ../packaging/linux/install.sh ../packaging/linux/com.verdana.app.desktop "$pkg/"
            cp assets/icon.png "$pkg/com.verdana.app.png"
            tar czf "release/verdana-${{ matrix.id }}.tar.gz" -C dist "verdana-${{ matrix.id }}"
          else
            mv verdana dist/verdana
            tar czf "release/verdana-${{ matrix.id }}.tar.gz" -C dist verdana
          fi

      # deb, rpm and arch packages of the same binary (packaging/linux/nfpm.yaml)
      - name: linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          for p in deb rpm archlinux; do
            case $p in
              deb) ext=deb ;;
              rpm) ext=rpm ;;
              archlinux) ext=pkg.tar.zst ;;
            esac
            nfpm package -f packaging/linux/nfpm.yaml -p $p -t "desktop/release/verdana-${{ matrix.id }}.$ext"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: verdana-${{ matrix.id }}
          path: desktop/release/*
          if-no-files-found: error

  flatpak:
    name: flatpak-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # the action uploads the bundle as an artifact of its own, which the
      # release job collects along with the others
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/linux/com.verdana.app.yml
          bundle: verdana-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  release:
    name: release
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
